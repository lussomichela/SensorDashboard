
# ----------------RPMsg / OpenAMP----------------

CONFIG_IPM=y 
#Enables the inter processor messaging system to allow data exchange
CONFIG_OPENAMP=y 
#loads the OpenAMP library, which is the standard for communication between different cores
CONFIG_RPMSG_SERVICE=y 
#activates the service layer on top of OpenAMP to make messaging easier 
CONFIG_IPC_SERVICE=y
#enables the intwe peocess communication service
CONFIG_RPMSG_SERVICE_MODE_MASTER=y 
#sets Zephyr as the master in the communication 



#----------------FROM MAIN.C----------------

#Console and data formatting
CONFIG_PRINTK=y 
CONFIG_CBPRINTF_FP_SUPPORT=y  

#Random number generation (sys_rand32_get)
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

#Memory management (x86)
CONFIG_X86_COMMON_PAGE_TABLE=n
#disables standard page tables to simplify memory management on x86 platform 
CONFIG_SRAM_REGION_PERMISSIONS=n
#turns off specific RAM permissions to avoid access errors
CONFIG_X86_MMU=n
#disables the MMU (memory management unit) because the memory size doesn't match the standard 4kB blocks
CONFIG_HEAP_MEM_POOL_SIZE=16384 
#allocates dynamic memory RAM for the application use 
CONFIG_MAIN_STACK_SIZE=4096 
#increases the memory space (stack) 
